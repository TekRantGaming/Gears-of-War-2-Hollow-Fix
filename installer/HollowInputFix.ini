; Gears of War 2: Hollow - Controller & HUD Fix
; Lives in the game's Binaries folder, next to GoW2Hollow.exe.
; Changes take effect the next time the game starts.

[Fixes]
; 1 = on, 0 = off.
; ControllerFix: stops one controller showing up as two (two players signed in on the main
;   menu) when the game is launched through Steam as a non-Steam game.
ControllerFix=1
; HUDFix: scales the in-game HUD (weapon/ammo, crosshair, prompts) and subtitles up at
;   1440p/4K. The menus already scale on their own and are not touched.
HUDFix=1

[General]
; Writes HollowInputFix.log next to this file (useful when reporting problems).
Log=1

[XInput]
; Controller fix detail.
; 1 = the game sees exactly one controller (player 1). Right for online co-op, where each
;     player is on their own PC.
; 0 = pass every controller through unchanged (only needed for local split-screen).
SingleController=1
; -1 = pick automatically. 0-3 = always use that physical XInput slot.
SourceSlot=-1

[DirectInput]
; Controller fix detail.
; 1 = hide DirectInput game controllers from the engine. Some pads expose extra HID devices
;     that the old engine code treats as another joystick. XInput still drives your pad,
;     and keyboard and mouse are not affected.
HideGameControllers=1

[HUD]
; HUD fix detail.
; auto = screen height / ReferenceHeight (1440p -> 2x, 4K -> 3x), or a fixed number like 1.5
Scale=auto
; The HUD was designed for 720p. Raise this (e.g. 1080) for a smaller HUD.
ReferenceHeight=720
MaxScale=4
; Draw subtitles at the same scale as the HUD.
ScaleSubtitles=1
